<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RS3 Desk</title>
<link rel="icon" href="icon.png" sizes="256x256">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat.cdn.min.css">
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head>
<body>
<main class="ge" aria-labelledby="ge-title">
  <header class="ge-bar">
    <img src="icon.png" alt="" width="28" height="28">
    <h1 id="ge-title">RS3 Desk</h1>
    <p id="plan-when" class="ge-sub"></p>
  </header>

  <ol id="grid" class="ge-grid" aria-label="Grand Exchange slots"></ol>
</main>

<template id="slot-tpl">
  <li class="ge-slot">
    <article class="ge-card">
      <header class="ge-head">
        <h2 class="ge-title"></h2>
        <span class="ge-badges"></span>
      </header>
      <div class="ge-body"></div>
    </article>
  </li>
</template>

<template id="panel-tpl">
  <li class="ge-slot">
    <section class="ge-card ge-panel" aria-labelledby="panel-h">
      <header class="ge-head"><h2 class="ge-title" id="panel-h">Report &amp; refresh</h2></header>
      <div class="ge-body">
        <dl class="ge-stats">
          <div><dt>Cash</dt><dd id="st-cash">–</dd></div>
          <div><dt>In stock</dt><dd id="st-stock" title="Money tied up in goods you hold that haven't sold, at what you paid">–</dd></div>
          <div><dt>Profit</dt><dd id="st-pl">–</dd></div>
          <div><dt>Changes</dt><dd id="st-pending">none</dd></div>
        </dl>
        <fieldset class="ge-when">
          <legend>Next check-in</legend>
          <div class="ge-seg" role="radiogroup" aria-label="Next check-in">
            <label><input type="radio" name="mode" value="watch"><span>Watching</span></label>
            <label><input type="radio" name="mode" value="normal" checked><span>Normal</span></label>
            <label><input type="radio" name="mode" value="hours"><span>In</span>
              <input class="ge-num tiny" type="number" name="hours" min="1" max="36" step="0.5" value="2" aria-label="hours from now">h</label>
            <label><input type="radio" name="mode" value="at"><span>At</span>
              <input class="ge-num tiny time" type="time" name="at" value="07:00" aria-label="back at"></label>
            <label><input type="radio" name="mode" value="away"><span>Away</span>
              <input class="ge-num tiny" type="number" name="days" min="1" max="14" value="2" aria-label="days away">d</label>
          </div>
        </fieldset>
        <div class="ge-go">
          <button type="button" class="ge-btn gold" id="btn-refresh">Save &amp; refresh</button>
          <button type="button" class="ge-btn" id="btn-save">Save only</button>
        </div>
        <p id="status" class="ge-status" role="status" aria-live="polite"></p>
        <div class="ge-links">
          <button type="button" class="ge-btn small" id="btn-totals">Totals</button>
          <button type="button" class="ge-btn small" id="btn-machines">Machines</button>
          <label class="sr" for="history">Earlier plans</label>
          <select id="history" class="ge-select"><option value="">Earlier plans…</option></select>
        </div>
      </div>
    </section>
  </li>
</template>

<dialog id="dlg" class="dialog ge-dialog" aria-labelledby="dlg-h">
  <div>
    <header><h2 id="dlg-h">Totals</h2></header>
    <section>
      <pre id="dlg-body"></pre>
      <iframe id="dlg-frame" title="Earlier plan" hidden></iframe>
      <form id="bank" class="ge-bank" hidden>
        <h3>Record stock in the bank</h3>
        <label class="label">For
          <select class="select" name="kind"><option value="alch">Alchemiser mk. II</option><option value="disasm">Auto disassembler mk. II</option><option value="supply">Supplies (Nature rune / Divine charge)</option></select></label>
        <label class="label">Item <input class="input" name="item" required placeholder="Water battlestaff"></label>
        <label class="label">Quantity <input class="input" name="qty" type="number" min="0" required></label>
        <button class="btn" type="submit">Save</button>
      </form>
    </section>
    <footer><button class="btn" data-variant="outline" type="button" id="dlg-close">Close</button></footer>
  </div>
</dialog>
</body>
</html>
